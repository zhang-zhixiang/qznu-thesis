name: build-and-check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: qznu-thesis.tex
          latexmk_use_xelatex: true
          args: -outdir=build

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Check content requirements
        run: python3 scripts/check_content.py

      - name: Check PDF layout and fonts
        run: python3 scripts/check_pdf.py build/qznu-thesis.pdf --log build/qznu-thesis.log
